# Souk trades: every market street of an old town gets one, and its shops show these goods.
# shop: what fills the shelves (spices, perfume, pots, copper, chechia, fruit, cloth).
# ground, wall: piece names or roles from [dressing.roles]; "tounes/..." pieces come from Tounes Rush.
[[souk]]
