trades.residential = [["teacher", 2], ["mechanic", 2], ["nurse", 1.5], ["taxi driver", 1.5], ["shopkeeper", 2], ["civil servant", 2], ["engineer", 1], ["baker", 1], ["fisherman", 1], ["builder", 2]]
trades.colonial = [["doctor", 1], ["lawyer", 1], ["teacher", 1.5], ["cafe owner", 1.5], ["tailor", 1], ["banker", 0.7], ["pharmacist", 1], ["painter", 0.5], ["journalist", 0.5]]
trades.modern = [["teacher", 2], ["nurse", 2], ["civil servant", 3], ["engineer", 1.5], ["student", 2], ["mechanic", 1], ["shopkeeper", 1.5]]
