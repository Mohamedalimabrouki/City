# Style pack: an invented Mediterranean / North African country.
#
# A style pack decides how the world looks and sounds: names, colors,
# districts and buildings. The code never hard-codes these, so a new style
# (a different culture, era or genre) is a new file in this folder.
# Distances are meters, colors are web colors (#RRGGBB).

name = "Maghreb"
qibla_bearing = 105.0  # compass direction every mosque faces (0 = north, 90 = east)

# --- names ---------------------------------------------------------------------
[names]
# Invented names follow the patterns of North African place names, spelled the Tunisian (French)
# way: "ou" for u, "ch" for sh, "dj" for j, "gh" and "kh" for the throat sounds.
onsets = ["b", "d", "f", "g", "h", "k", "l", "m", "n", "r", "s", "t", "z", "ch", "dj", "gh", "kh", "b", "k", "m", "s", "t", "z", "r", "g"]
vowels = ["a", "a", "a", "e", "i", "ou", "ou", "o"]
codas = ["", "", "", "", "n", "r", "l", "m", "s", "z", "b", "k"]
endings = ["a", "a", "ane", "ouane", "ine", "ine", "ir", "ra", "ka", "ba", "ia", "ouna", "es", "el", "ar"]
berber_chance = 0.15        # names built like Tamezret, Takrouna or Tataouine
berber_endings = ["ret", "rout", "ine", "ane", "ount", "ra", "ka", "ouine"]
country_endings = ["ia", "a", "ane"]
prefixes.village = ["Bir", "Ain", "Henchir", "Sidi", "Sidi Bou", "Douar", "Oued", "Ras", "Dar", "Ouled", "Beni", "Zaouiet"]
prefixes.town = ["Menzel", "Ksar", "Souk", "Bordj", "Ain", "Sidi", "Hammam", "Kalaat", "Bou", "Ras"]
prefixes.city = ["El", "Menzel", "Ksar"]
prefix_chance = { village = 0.6, town = 0.4, city = 0.12, capital = 0.0 }
article_prefixes = ["Bir", "Ain", "Ras", "Oued", "Henchir", "Ksar", "Hammam", "Souk", "Menzel", "Bordj", "Dar", "Kalaat"]
article_chance = 0.3        # "Ras el Mokrane" instead of "Ras Mokrane"
compound_chance = { village = 0.15, town = 0.15, city = 0.1, capital = 0.0 }
descriptors = ["Kebir", "Sghir", "Djedid", "Bahri", "Gharbi", "Chergui", "Zitoun", "Rmel", "Melh", "Nakhla", "Ghar", "Souk", "Bey"]
# Arabic twins (prompt 87): each *_ar list has one entry per entry of its Latin list, so a name is spelled in
# Arabic part by part from the same draws. Short vowels are not written: some "a" are ا, some nothing, "e"
# nothing; "i" is ي, "ou" and "o" و. A repeated onset can be an emphatic letter (the second s ص, t ط, k ق);
# "g" is ق as in official Tunisian names (قفصة، قابس); set g_ar = "ڨ" for the Tunisian letter instead.
onsets_ar = ["ب", "د", "ف", "ق", "ح", "ك", "ل", "م", "ن", "ر", "س", "ت", "ز", "ش", "ج", "غ", "خ", "ب", "ق", "م", "ص", "ط", "ز", "ر", "ق"]
vowels_ar = ["ا", "", "ا", "", "ي", "و", "و", "و"]
codas_ar = ["", "", "", "", "ن", "ر", "ل", "م", "س", "ز", "ب", "ك"]
endings_ar = ["ة", "ة", "ان", "وان", "ين", "ين", "ير", "رة", "كة", "بة", "ية", "ونة", "س", "ل", "ار"]
berber_endings_ar = ["رت", "روت", "ين", "ان", "ونت", "رة", "كة", "وين"]
country_endings_ar = ["يا", "ا", "ان"]
# "Bou" and "El" are joined to the name in Arabic (بوسالم، الكبيرة)
prefixes_ar.village = ["بئر", "عين", "هنشير", "سيدي", "سيدي بو", "دوار", "وادي", "رأس", "دار", "أولاد", "بني", "زاوية"]
prefixes_ar.town = ["منزل", "قصر", "سوق", "برج", "عين", "سيدي", "حمام", "قلعة", "بو", "رأس"]
prefixes_ar.city = ["ال", "منزل", "قصر"]
descriptors_ar = ["كبير", "صغير", "جديد", "بحري", "غربي", "شرقي", "زيتون", "رمل", "ملح", "نخلة", "غار", "سوق", "باي"]   # the article ال is added
# A describing word agrees with a feminine core (its Arabic ends in ة, its Latin in one of these): Kalaa el Kebira.
# The same draw picks the same place in these lists, one entry per descriptor; a noun (Zitoun, Souk) stays as it is.
feminine_endings = ["a"]
descriptors_f = ["Kebira", "Sghira", "Djedida", "Bahria", "Gharbia", "Cherguia", "Zitoun", "Rmel", "Melh", "Nakhla", "Ghar", "Souk", "Bey"]
descriptors_f_ar = ["كبيرة", "صغيرة", "جديدة", "بحرية", "غربية", "شرقية", "زيتون", "رمل", "ملح", "نخلة", "غار", "سوق", "باي"]
# names built without a draw: the old town, its great mosque (a village's mosque), the souk repeats
medina = "Medina of {s}"
medina_ar = "مدينة {s} العتيقة"
great_mosque = "Great Mosque of {s}"
great_mosque_ar = "الجامع الكبير ب{s}"
village_mosque = "Mosque of {s}"
village_mosque_ar = "جامع {s}"
souk = "Souk {a} {w}"
souk_ar = "سوق {w}"
souk_repeats = ["", " el Djedid", " el Kebir", " es Sghir", " el Bahri", " el Gharbi", " ech Chergui"]
souk_repeats_ar = ["", " الجديد", " الكبير", " الصغير", " البحري", " الغربي", " الشرقي"]
# Real towns are never generated, so the world never copies an existing place.
avoid = ["tunis", "sfax", "sousse", "kairouan", "bizerte", "gabes", "ariana", "gafsa", "monastir", "kasserine",
         "mahdia", "nabeul", "tataouine", "beja", "jendouba", "kebili", "tozeur", "siliana", "zaghouan", "medenine",
         "kef", "hammamet", "tabarka", "djerba", "douz", "nefta", "matmata", "zarzis", "korba", "kelibia", "moknine",
         "msaken", "testour", "takrouna", "tamezret", "chenini", "carthage", "marsa", "rades", "manouba", "soliman",
         "alger", "algiers", "oran", "constantine", "annaba", "tlemcen", "setif", "batna", "biskra", "blida", "bejaia",
         "fes", "fez", "rabat", "marrakech", "tanger", "agadir", "meknes", "oujda", "tetouan", "nador", "safi",
         "tripoli", "benghazi", "misrata", "zawiya", "sabha", "derna"]

[names.districts]
# {n} is an invented name, {a} its Arabic article (el, es, ech...).
colonial = ["Quartier {n}", "Ville {n}", "{n}"]
modern = ["Cite {n}", "Hay {n}", "Cite {a} {n}"]
residential = ["Hay {n}", "{n}", "Hay {a} {n}"]
suburb = ["Riadh {n}", "Jardins de {n}", "{n}"]
industrial = ["Zone Industrielle {n}"]
port = ["Port de {n}"]
park = ["Parc {n}", "Belvedere {n}"]
cemetery = ["Cemetery of Sidi {n}"]
gate = ["Bab {n}", "Bab {a} {n}"]
mosque = ["Jamaa {n}", "Jamaa {a} {n}"]
kasbah = ["Kasbah of {s}", "Kasbah of {s}", "Kasbah {a} {n}", "Dar {a} {n}", "Bordj {a} {n}"]   # {s}: the city
cathedral = ["Cathedral of St {g} de {n}"]   # {g}: a saint from [landmarks.cathedral] saints; {n} an invented place
theatre = ["Theatre Municipal de {s}", "Theatre Municipal de {s}", "Grand Theatre de {s}"]
station = ["Gare de {s}", "Gare de {s}", "Gare Centrale de {s}", "Gare de {s}-Ville"]   # the railway station (prompt 33)
lighthouse = ["Phare de {s}", "Phare de la Jetee", "Phare de Ras {n}", "Phare de Sidi {n}"]   # the harbor light (prompt 34)

[names.districts_ar]
# Arabic twins of [names.districts], one per template; the article is written ال{n}, joined.
colonial = ["حي {n}", "مدينة {n}", "{n}"]
modern = ["حي {n}", "حي {n}", "حي ال{n}"]
residential = ["حي {n}", "{n}", "حي ال{n}"]
suburb = ["رياض {n}", "حدائق {n}", "{n}"]
industrial = ["المنطقة الصناعية {n}"]
port = ["ميناء {n}"]
park = ["منتزه {n}", "بلفيدير {n}"]
cemetery = ["مقبرة سيدي {n}"]
gate = ["باب {n}", "باب ال{n}"]
mosque = ["جامع {n}", "جامع ال{n}"]
kasbah = ["قصبة {s}", "قصبة {s}", "قصبة ال{n}", "دار ال{n}", "برج ال{n}"]
cathedral = ["كاتدرائية القديس {g} ب{n}"]
theatre = ["المسرح البلدي ب{s}", "المسرح البلدي ب{s}", "المسرح الكبير ب{s}"]
station = ["محطة {s}", "محطة {s}", "المحطة المركزية ب{s}", "محطة {s} المدينة"]
lighthouse = ["منارة {s}", "منارة الرصيف", "منارة رأس {n}", "منارة سيدي {n}"]

[lore]
# Fictional history: settlements are said to date from one of these eras.
eras = ["the Salt Kings", "the Caravan Age", "the Exiles' Return", "the Corsair Century", "the Protectorate", "the Republic"]
products.coast = ["fishing", "sea salt", "sponge diving", "boat building", "sea trade"]
products.green = ["olive oil", "citrus", "wheat", "almonds", "pottery"]
products.steppe = ["sheep", "esparto weaving", "barley", "honey"]
products.desert = ["dates", "carpets", "camel markets", "rock salt"]
products.mountain = ["cork", "marble", "pine honey", "goat cheese"]

# District histories (prompt 81, city/history.py): an origin sentence, up to `facts` sentences on what
# the map holds, and a "today" sentence when fewer than three came. {name} the district, {city},
# {era} and {since} from `era` (never before the city's founding), as `era_in` / `era_since` word it,
# {where} ", just east of the medina" or "",
# {place} city, town or village, {folk} "the neighborhood" or "the village". A fact given as a list: one is
# drawn, on a stream of its own (as are the origin, the "today" sentence and the sample of facts).
# A world file's [canon.histories."<city>"] "<district>" = "..." replaces a generated text.
[history]
facts = 2
min_sentences = 3      # a "today" sentence is added below this many
max_sentences = 4
inside_m = 1.0         # a landmark this close to a district counts as in it
near_m = 5.0           # a district this close to the medina lies "just" east of it
# The words of the sentences: {place} by settlement kind (else the kind itself), {folk} by district
# kind (else `default`), {where} from `where` ({near} = `near_word` when near, {dir} from `compass`,
# counter-clockwise from east), counts in words, the last link of a list, and trade plurals (first matching
# ending swapped).
place = { capital = "city" }
folk = { village = "the village", default = "the neighborhood" }
where = ", {near}{dir} of the medina"
near_word = "just "
compass = ["east", "north-east", "north", "north-west", "west", "south-west", "south", "south-east"]
numbers = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"]
and_word = " and "
plural = { man = "men", ry = "ries", ty = "ties", ss = "sses", ch = "ches", sh = "shes" }
plural_default = "s"
great_mosque_kinds = ["medina", "village"]   # the mosque in these districts is the great mosque, never "its own mosque"
era.medina = ""          # "": the era the city was founded in
era.village = ""
era.cemetery = ""
era.colonial = "the Protectorate"
era.port = "the Protectorate"
era.park = "the Protectorate"
era.park_late = "the Republic"   # a park in a city without a colonial quarter
era.industrial = "the Republic"
era.modern = "the Republic"
era.residential = "the Republic"
era.suburb = "the Republic"
# How each era reads in a sentence: {era} "in the Caravan Age", {since} "since the Caravan Age"; an era missing
# from these tables reads as the `_default` line (a test keeps every era of [lore] in them)
era_in_default = "in the time of {era}"
era_since_default = "since the time of {era}"
era_in = { "the Salt Kings" = "under the Salt Kings", "the Caravan Age" = "in the Caravan Age", "the Exiles' Return" = "in the years of the Exiles' Return", "the Corsair Century" = "in the Corsair Century", "the Protectorate" = "under the Protectorate", "the Republic" = "under the Republic" }
era_since = { "the Salt Kings" = "since the days of the Salt Kings", "the Caravan Age" = "since the Caravan Age", "the Exiles' Return" = "since the Exiles' Return", "the Corsair Century" = "since the Corsair Century", "the Protectorate" = "since the Protectorate", "the Republic" = "since the Republic" }
# Products of [lore] that a harbor district may be said to live from
harbor_trades = ["fishing", "sponge diving", "boat building", "sea trade"]
origin.medina = ["The {name} is the oldest part of the {place}: its first walls went up {era}.",
                 "{city} began here, inside walls raised {era}; its ramparts still stand.",
                 "The {name} grew up {era}, a tight weave of courtyard houses, alleys and dead ends."]
# An old town whose settlement kind has walls = false: no walls in its story
origin.medina_open = ["The {name} is the oldest part of the {place}: its first houses went up {era}.",
                      "{city} began here {era}, around its great mosque and its market.",
                      "The {name} grew up {era}, a tight weave of courtyard houses, alleys and dead ends."]
origin.village = ["{name} grew up {era} around its wells and its fields.",
                  "Families have lived in {name} {since}, in houses built around their courtyards."]
origin.colonial = ["{name} was laid out {era}{where}, on straight streets of tall houses with balconies.",
                   "{era} the newcomers built {name}{where}: a grid of avenues, cafes and apartment houses."]
origin.modern = ["{name} was built {era}{where}, when {city} needed homes for the workers and clerks of the new state.",
                 "The blocks of {name} went up {era}{where}, as {city} grew faster than ever before."]
origin.residential = ["{name} filled in {era}{where}, as families from the countryside came to {city} and built storey by storey.",
                      "{name} grew {era}{where}, one family house at a time."]
origin.suburb = ["{name} began {era}{where}, as villas and gardens for the families who could leave the crowded center.",
                 "{era} the well-off of {city} built their villas at {name}{where}."]
origin.industrial = ["{name} was laid out {era}{where}, by the roads out of {city}, for its workshops, depots and warehouses."]
origin.port = ["The quays of {name} were built {era}{where}.",
               "{name} took its present shape {era}{where}, when {city} built its quays."]
origin.port_old = ["Boats have put in here {old_since}, but the stone quays of {name} were built {era}.",
                   "The fishermen of {city} have beached their boats here {old_since}; {name} got its stone quays {era}."]
origin.park = ["{name} was planted {era}{where}, as a public garden for {city}.",
               "{name} was laid out as gardens {era}{where}.",
               "{era}, {city} kept the open ground of {name} free of houses{where}, and planted it."]
origin.cemetery = ["The {name} has received the dead of {city} {since}{where}.",
                   "{since}, {city} has buried its dead in the {name}{where}."]
fact.gate = "{n} gate leads in: {some}."            # one gate
fact.gates_all = "{n} gates lead in: {some}."       # two gates, both named
fact.gates = "{n} gates lead in, among them {some}."
fact.kasbah = "The {kasbah}, the citadel, still holds the high edge of the old town."
fact.boulevard = "Its boulevard is lined by the {cathedral} and the {theatre}."
fact.civic = "The {civic} faces its boulevard."
fact.station = "The railway reaches {city} here, at the {station}."
fact.mosque = "Its own mosque, the {mosque}, gathers {folk} at prayer."
fact.souks = "Its market streets still keep the old crafts together: the {souks}."
fact.shrine = "A white-domed shrine of a holy man stands among its graves."   # one shrine
fact.shrines = "{n} white-domed shrines of holy men stand among its graves."
fact.quays = "Today it has {quay} m of quays."
fact.light = ", and a breakwater with a lighthouse at its end."
fact.known = "{city} is known for its {known}, and much of it goes on here."
fact_weights = { gates = 3, kasbah = 3, boulevard = 3, civic = 3, station = 3, souks = 2, shrines = 2, quays = 2, known = 1, mosque = 1, trades = 1 }
fact.trades = ["The trades most often found behind its doors are those of {trades}.", "Its people work above all as {trades}.", "Behind its doors live above all {trades}."]
today.medina = ["Its families still live behind plain walls around their courtyards."]
today.village = ["Little in it has changed for generations."]
today.colonial = ["Its cafes and shops still fill the ground floors.", "Lawyers, doctors and banks keep their offices in its old buildings."]
today.modern = ["Its blocks are home to many young families.", "Its balconies fill with washing and satellite dishes."]
today.residential = ["Most of its houses have grown a floor or two since they were built.", "Its streets fill with children when the schools let out.", "Small grocers and cafes keep its corners busy."]
today.suburb = ["Its villas sit in gardens behind high walls.", "Bougainvillea spills over its garden walls."]
today.industrial = ["Many of the workers of {city} come here every morning.", "Lorries come and go on its wide streets all day."]
today.port = ["Fishing boats tie up along it all year round.", "Its cafes open early, for the men who work the quays."]
today.park = ["On summer evenings families walk its paths.", "Its benches fill with old men and students in the afternoons.", "Children play football on its open ground."]
today.cemetery = ["On Fridays families still come to visit their graves.", "Cypresses stand in rows between the tombs."]

# --- colors and surfaces ---------------------------------------------------------
# Every surface in the 3D files uses one of these materials (by name).
[palette]
