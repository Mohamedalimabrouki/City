# --- generated textures (prompt 18) ----------------------------------------------
# One code-made image per surface: near-neutral grey detail around white, seamless. The palette
# color of the material that names it multiplies the image, so one plaster serves every wall
# color. `pixels` = image side (256 or 512); `grain`, `mottle`, `stain` = strength of fine,
# medium and broad detail (0-1); `band` = strength of the colonial string course;
# `tint` = palette color the texture sheet shows until the palette maps it (prompt 19).
[textures]
plaster = { pixels = 512, grain = 0.7, mottle = 0.7, stain = 0.5, tint = "cream" }
render = { pixels = 512, grain = 0.7, mottle = 0.45, stain = 0.3, tint = "warm_white" }
render_cream = { pixels = 512, grain = 0.7, mottle = 0.45, stain = 0.3, band = 0.7, tint = "cream" }
stone = { pixels = 512, grain = 0.5, mottle = 0.45, stain = 0.4, tint = "rampart" }
concrete = { pixels = 512, grain = 0.4, mottle = 0.3, stain = 0.4, tint = "concrete" }
roof_tile = { pixels = 512, grain = 0.35, mottle = 0.3, stain = 0.4, tint = "roof_tile" }
roof_flat = { pixels = 512, grain = 0.5, mottle = 0.35, stain = 0.5, tint = "roof_white" }
paving = { pixels = 512, grain = 0.45, mottle = 0.4, stain = 0.4, tint = "paving" }
asphalt = { pixels = 512, grain = 0.7, mottle = 0.8, stain = 0.6, tint = "asphalt" }
earth = { pixels = 512, grain = 0.5, mottle = 0.2, stain = 0.15, tint = "earth" }   # weak blotches: no grid from the air
sand = { pixels = 512, grain = 0.4, mottle = 0.35, stain = 0.3, tint = "beach" }
grass = { pixels = 512, grain = 0.6, mottle = 0.3, stain = 0.25, tint = "grass" }
rock = { pixels = 512, grain = 0.5, mottle = 0.5, stain = 0.4, tint = "rock" }
scrub = { pixels = 512, grain = 0.55, mottle = 0.25, stain = 0.2, tint = "steppe" }
ballast = { pixels = 256, grain = 0.6, mottle = 0.3, stain = 0.3, tint = "ballast" }

# Large-scale terrain tint (prompt 20), written as COLOR_0 on terrain parts only: a soft
# brightness drift and a slight warm/cool shift from world-position noise, so texture repeats
# do not show from the air. Multipliers stay at or below 1 (glTF: color x texture x COLOR_0).
[ground_tint]
brightness = 0.08           # darkest patches lose this share of their brightness
warmth = 0.04               # red/blue shift between the warmest and the coolest patches
wavelength = 350.0          # meters: size of the bright and dark patches
warm_wavelength = 900.0     # meters: size of the warm and cool areas
octaves = 3
riparian = [0.74, 0.88, 0.66]   # the land along a river: greener and darker, multiplied in (prompt 60)
riparian_fade = 34.0        # meters past the valley floor over which that fades out

[water]                     # the ground by a river (prompt 60, mesh/water.py): colors on `river_bed`'s points
bank = "#94866A"            # bare damp earth on the banks
bed = "#5C5848"             # wet pebbles under the water
oued = "#D2C4A6"            # a dry oued's pale gravel
salt_rim = "#D9D3C4"        # the dry crust round a salt flat
rim_height = 1.0            # meters over a lake's level its shore stays bare...
salt_rim_height = 2.4       # ...and a salt flat's rim stays pale
rock_slope = [0.22, 0.42]   # a valley's cut walls fade to bare rock between these slopes
wall_cut = 0.2              # meters cut into the land before a cell counts as such a wall
bank_fade = 3.5             # meters past the bank over which it fades into the land
bed_fade = 1.2              # meters from the water's edge to the full color of the bed

[river]                     # a river in a city (prompt 61, city/river.py)
walk = 5.0                  # meters of paved walk on the corridor's edge, where the settlement has `riverside`
walk_piece = 64.0           # meters: the walk in pieces of about this size, so a tile can own each
walk_step = 3.0             # meters between a walk's outline points in a river's valley, where the ground bends
tree = "broadleaf"          # the row of shade trees along it
tree_spacing = 16.0         # meters
tree_height = [6.0, 10.0]   # meters
min_part = 60.0             # meters of street: a smaller piece of a bank gets no crossing of its own
min_piece = [6000.0, 12.0]  # a piece of a neighborhood across the river, square meters and meters of inset it must
                            # survive: a smaller one is left to the bank

[bridges]                   # bridges and fords (prompt 62, city/bridges.py); `Bridge` records for the mesher
skew = 30.0                 # degrees: a crossing keeps its own line this near the river's normal, else it turns square
slide = 15.0                # meters along the river between the places tried when a square line finds no room
gap = 60.0                  # meters along a river: of two crossings nearer than this the higher kind stays
every = 500.0               # meters: most river between bridges, or from one to the end of the streets on its banks
reach = 150.0               # meters from a river's middle to the first street on a bank
snap = 15.0                 # meters: a new bridge turns to a junction this near on the far bank
stretch_step = 25.0         # meters along a river between looks at its banks
clearance = [0.9, 0.12, 5.0]  # air from water to soffit, meters: the least, per meter of water width, the most
depth = 0.6                 # meters, from a deck's top to its soffit
grade = 0.09                # steepest ramp; the air gives way first, down to `clearance`'s least
ford_grade = 0.16           # steepest ramp of a ford: a slab on the gravel, down its low banks, not a causeway
ford_lean = 0.25            # most a ford leans across, meters per meter, with a bank it meets aslant
crown = 8.0                 # meters over which the top of a ramp is rounded
tuck = 0.02                 # meters a bridge's ribbon lies under the street it meets, or the wider road's it shares
share = 1.0                 # m2: two roads' decks that overlap this much are one crossing, with the wider road's structure
own_least = 2.0             # meters: the least a road keeps of its own structure beyond the wider road's deck
ramp_reach = 250.0          # meters along a road to look for the ground at the foot of a ramp
old_reach = 60.0            # meters: a bridge with an end this near the old town is stone
arch_max = 90.0             # meters: an arch bridge's longest open part, beyond it concrete
arch_span = 14.0            # meters: one arch
arch_flat = 0.12            # the least rise of an arch to its length: flatter, and more arches do it
arch_least = 4.5            # meters: the shortest arch
beam_span = 22.0            # meters: one span of beams
pier_water = 12.0           # meters: no pier in the water of a stream narrower than this
open_air = 0.8              # meters under the soffit where a ramp's solid fill gives way to the open part
# what stands under the deck (mesh/bridges.py). Pairs and lists are in the order their comment gives.
bury = 0.4                  # meters a wall's or a pier's foot goes under the lowest ground round it
step = 6.0                  # meters: longest step between a structure's stations
sidewalk_from = 11.0        # meters: a city deck this wide has a raised sidewalk along each parapet
sidewalk = [1.8, 0.18]      # its width, its curb's width
parapet = [1.0, 0.36]       # a stone parapet: height over the deck, thickness
coping = [0.12, 0.03]       # its coping: height, overhang on each side
end_post = [0.64, 1.28, 0.14, 0.05]   # the stouter post at a parapet's end: side, height, its cap's height and overhang
string_course = [0.17, 0.07]   # the band of stone at the deck: height, how far proud of the wall
ring = [0.42, 0.06, 0.75, 0.025, 0.8]   # the dressed stones round an arch: depth, proud, length, joint, a short stone's depth
pier = [0.22, 1.4, 2.6, 0.12] # an arch's pier: thickness to the arch's length, least, most, how far proud of the wall
nose = [0.7, 0.55]          # its cutwaters: length to the thickness, slope of their stone caps
pier_cap = [0.26, 0.08]     # the capstone under the springing: height, how far proud
spring_over = [0.25, 0.3]   # from the water to where an arch springs: least meters, part of the height to the soffit
arch_gap = 0.35             # least meters from where an arch springs to the soffit over it
wet_band = 0.18             # meters of dark wet stone over the water on a pier
arc_sides = 12              # sides of a round column
girder = [0.5, 0.24, 3.6]   # a concrete deck's girders: width, depth under the slab, meters apart
shadow = [0.09, 0.09]       # the shadow line under the kerb: height, depth
seat = [0.45, 0.3]          # an abutment's seat under the girders: how far out, height
kerb = [0.34, 0.34]         # a concrete parapet's kerb: height, width
rail = [1.08, 0.72, 0.06, 0.05]  # its rails: top height, second rail's height, width, depth
rail_post = [2.8, 0.07]     # its posts: meters apart, side
concrete_end = [0.5, 1.22]  # the block at the end of a concrete parapet: side, height
cap_beam = [0.65, 1.2, 0.5] # the cap beam over a pier: height, thickness, how far short of the deck's edge
column = [0.42, 4.6, 1.3]   # round columns: radius, meters apart at most, how far in from the deck's edge
pier_tall = 5.0             # meters under the soffit: taller than this a pier is a wall
wall_pier = [1.1, 1.4]      # a wall pier: thickness, how far short of the deck's edge
ford_post = [6.0, 0.11, 0.95, 0.22]   # a ford's marker posts: meters apart, side, height, in from the edge
ford_bands = [0.35, 0.22, 0.2]   # their red bands: height of the first, band's height, gap
ford_gauge = [0.16, 2.4, 0.5]    # the flood gauges at the channel's two ends: side, height, each band's height

# --- streets ---------------------------------------------------------------------
# Raised sidewalks (prompt 13) and their crisp curb. Widths per district are below.
[streets]
curb_height = 0.15          # meters above the street ribbon
walk_reach = 0.05           # a walk point takes the lift of streets this close (block-side edge)
walk_step = 15.0            # meters between outline points, so a long sidewalk follows the ground
min_carriageway = 5.5       # a sidewalk is narrowed until this much asphalt remains
promenade_width = 8.0       # the raised island under the boulevard's middle tree row
promenade_piece = 64.0      # meters; short pieces keep a tile's mesh local
apron_reach = 6.0           # a paved lot corner (prompt 23) blends the lifts of the streets this close
apron_cell = 2.0            # meters: its paving is cut in squares this big on the world grid, to follow the ground

# painted markings (S1): flat polygons just above the ribbon
marking_min_width = 8.0     # only streets wider than this get paint
paint_width = 0.12          # a line's width in meters
paint_lift = 0.03           # above the street ribbon (at 0.01 it flickers in aerial views)
paint_step = 6.0            # meters between outline points, as along the ribbon, so no line sinks
paint_edge_inset = 0.4      # an edge line sits this far inside the carriageway edge
paint_dash = [3.0, 4.5]     # dash and gap of a center or lane line
crossing_length = 3.0       # zebra bar length along the street
crossing_stripe = 0.55      # zebra bar width
crossing_gap = 0.55         # gap between zebra bars
crossing_junction_gap = 1.0 # the first bar starts this far outside the junction

[streets.surface]           # ribbon material per street kind; village streets become earth
boulevard = "asphalt"
arterial = "asphalt"
ring = "asphalt"
corniche = "asphalt"
connector = "asphalt"
street = "asphalt"
bridge = "asphalt"
souk = "paving"
alley = "paving"

[impasse]                  # dead-end lanes cut to lots without a street (city/impasses.py)
min_front = 3.0            # a lot needs a side this long facing a street, or it gets an impasse
souk_front = 8.0           # on a souk the shop takes the middle: this much wall leaves room for the house door
mouth_overlap = 1.0        # the lane's ribbon reaches this far into the street it opens on
junction_clear = 2.0       # a mouth keeps this far (beyond half the lane) from any second street
jitter = 0.15              # random share added to each lot line's length, so lanes vary
new_mouth = 10.0           # meters a lane would rather run to branch off a lane already cut than open a new mouth
mouth_penalty = { boulevard = 40.0, corniche = 40.0, arterial = 25.0, ring = 25.0, connector = 15.0 }

[impasse.medina]           # the driba: narrow, paved, sometimes covered at its mouth
width = [2.2, 3.0]         # meters, drawn per lane
surface = "paving"
max_length = 70.0          # meters from the mouth to the farthest dead end
min_lot = 30.0             # lots the lanes leave smaller than this are dropped
covered = 0.35             # chance a lane opening on a street is covered at its mouth
covered_length = [3.0, 5.5]

[impasse.village]
width = [2.6, 3.4]
surface = "earth"
max_length = 70.0
min_lot = 45.0
covered = 0.12
covered_length = [2.5, 4.0]

[impasse.residential]      # the "impasse" of a modern neighborhood: a short asphalt cul-de-sac
width = [3.5, 4.0]
surface = "asphalt"
max_length = 60.0
