# --- generated textures (prompt 18) ----------------------------------------------
# One code-made image per surface: near-neutral grey detail around white, seamless. The palette
# color of the material that names it multiplies the image, so one plaster serves every wall
# color. `pixels` = image side (256 or 512); `grain`, `mottle`, `stain` = strength of fine,
# medium and broad detail (0-1); `band` = strength of the colonial string course;
# `tint` = palette color the texture sheet shows until the palette maps it (prompt 19).
[textures]
plaster = { pixels = 512, grain = 0.7, mottle = 0.7, stain = 0.5, tint = "cream" }
render = { pixels = 512, grain = 0.7, mottle = 0.45, stain = 0.3, tint = "warm_white" }
render_cream = { pixels = 512, grain = 0.7, mottle = 0.45, stain = 0.3, band = 0.7, tint = "cream" }
stone = { pixels = 512, grain = 0.5, mottle = 0.45, stain = 0.4, tint = "rampart" }
concrete = { pixels = 512, grain = 0.4, mottle = 0.3, stain = 0.4, tint = "concrete" }
roof_tile = { pixels = 512, grain = 0.35, mottle = 0.3, stain = 0.4, tint = "roof_tile" }
roof_flat = { pixels = 512, grain = 0.5, mottle = 0.35, stain = 0.5, tint = "roof_white" }
paving = { pixels = 512, grain = 0.45, mottle = 0.4, stain = 0.4, tint = "paving" }
asphalt = { pixels = 512, grain = 0.7, mottle = 0.8, stain = 0.6, tint = "asphalt" }
earth = { pixels = 512, grain = 0.5, mottle = 0.2, stain = 0.15, tint = "earth" }   # weak blotches: no grid from the air
sand = { pixels = 512, grain = 0.4, mottle = 0.35, stain = 0.3, tint = "beach" }
grass = { pixels = 512, grain = 0.6, mottle = 0.3, stain = 0.25, tint = "grass" }
rock = { pixels = 512, grain = 0.5, mottle = 0.5, stain = 0.4, tint = "rock" }
scrub = { pixels = 512, grain = 0.55, mottle = 0.25, stain = 0.2, tint = "steppe" }

# Large-scale terrain tint (prompt 20), written as COLOR_0 on terrain parts only: a soft
# brightness drift and a slight warm/cool shift from world-position noise, so texture repeats
# do not show from the air. Multipliers stay at or below 1 (glTF: color x texture x COLOR_0).
[ground_tint]
brightness = 0.08           # darkest patches lose this share of their brightness
warmth = 0.04               # red/blue shift between the warmest and the coolest patches
wavelength = 350.0          # meters: size of the bright and dark patches
warm_wavelength = 900.0     # meters: size of the warm and cool areas
octaves = 3

# --- streets ---------------------------------------------------------------------
# Raised sidewalks (prompt 13) and their crisp curb. Widths per district are below.
[streets]
curb_height = 0.15          # meters above the street ribbon
walk_reach = 0.05           # a walk point takes the lift of streets this close (block-side edge)
walk_step = 15.0            # meters between outline points, so a long sidewalk follows the ground
min_carriageway = 5.5       # a sidewalk is narrowed until this much asphalt remains
promenade_width = 8.0       # the raised island under the boulevard's middle tree row
promenade_piece = 64.0      # meters; short pieces keep a tile's mesh local
apron_reach = 6.0           # a paved lot corner (prompt 23) blends the lifts of the streets this close
apron_cell = 2.0            # meters: its paving is cut in squares this big on the world grid, to follow the ground

# painted markings (S1): flat polygons just above the ribbon
marking_min_width = 8.0     # only streets wider than this get paint
paint_width = 0.12          # a line's width in meters
paint_lift = 0.03           # above the street ribbon (at 0.01 it flickers in aerial views)
paint_step = 6.0            # meters between outline points, as along the ribbon, so no line sinks
paint_edge_inset = 0.4      # an edge line sits this far inside the carriageway edge
paint_dash = [3.0, 4.5]     # dash and gap of a center or lane line
crossing_length = 3.0       # zebra bar length along the street
crossing_stripe = 0.55      # zebra bar width
crossing_gap = 0.55         # gap between zebra bars
crossing_junction_gap = 1.0 # the first bar starts this far outside the junction

[streets.surface]           # ribbon material per street kind; village streets become earth
boulevard = "asphalt"
arterial = "asphalt"
ring = "asphalt"
corniche = "asphalt"
connector = "asphalt"
street = "asphalt"
souk = "paving"
alley = "paving"

[impasse]                  # dead-end lanes cut to lots without a street (city/impasses.py)
min_front = 3.0            # a lot needs a side this long facing a street, or it gets an impasse
souk_front = 8.0           # on a souk the shop takes the middle: this much wall leaves room for the house door
mouth_overlap = 1.0        # the lane's ribbon reaches this far into the street it opens on
junction_clear = 2.0       # a mouth keeps this far (beyond half the lane) from any second street
jitter = 0.15              # random share added to each lot line's length, so lanes vary
new_mouth = 10.0           # meters a lane would rather run to branch off a lane already cut than open a new mouth
mouth_penalty = { boulevard = 40.0, corniche = 40.0, arterial = 25.0, ring = 25.0, connector = 15.0 }

[impasse.medina]           # the driba: narrow, paved, sometimes covered at its mouth
width = [2.2, 3.0]         # meters, drawn per lane
surface = "paving"
max_length = 70.0          # meters from the mouth to the farthest dead end
min_lot = 30.0             # lots the lanes leave smaller than this are dropped
covered = 0.35             # chance a lane opening on a street is covered at its mouth
covered_length = [3.0, 5.5]

[impasse.village]
width = [2.6, 3.4]
surface = "earth"
max_length = 70.0
min_lot = 45.0
covered = 0.12
covered_length = [2.5, 4.0]

[impasse.residential]      # the "impasse" of a modern neighborhood: a short asphalt cul-de-sac
width = [3.5, 4.0]
surface = "asphalt"
max_length = 60.0
min_lot = 45.0

[impasse.suburb]
width = [3.8, 4.4]
surface = "asphalt"
max_length = 70.0
min_lot = 150.0

# --- districts -------------------------------------------------------------------
# floors/walls/roofs are weighted choices: [value, how often].
[district.medina]          # the walled old town
alley_width = 3.0
souk_width = 5.0           # main market streets from the gates to the great mosque
cell = 34.0                # typical distance between alley crossings
keep_alleys = 0.62         # share of possible alleys that exist (lower = bigger blocks, more dead ends)
parcel_area = 165.0
floors = [[1, 0.5], [2, 0.42], [3, 0.08]]
floor_height = 3.4
walls = [["lime_white", 0.78], ["warm_white", 0.12], ["sand", 0.1]]
roofs = [["roof_white", 1.0]]
courtyard_min_area = 110.0
dome_chance = 0.035
courtyard_tree_chance = 0.3
menzah = 0.08              # share of courtyard houses with a menzah, a small room on the roof (prompt 23)
wall_height = 8.0          # city walls (ramparts)
wall_thickness = 3.0
tower_spacing = 55.0
gate_width = 7.0

[district.village]         # traditional villages: like a small, looser medina
alley_width = 4.0
souk_width = 5.0
cell = 52.0
keep_alleys = 0.72
parcel_area = 420.0
empty_share = 0.3          # share of lots left as yards and gardens
floors = [[1, 0.78], [2, 0.22]]
floor_height = 3.3
walls = [["lime_white", 0.6], ["sand", 0.25], ["ochre", 0.15]]
roofs = [["roof_white", 0.8], ["sand", 0.2]]
courtyard_min_area = 140.0
dome_chance = 0.02
courtyard_tree_chance = 0.45
menzah = 0.04

[district.colonial]        # the "ville nouvelle": boulevards and apartment buildings from the protectorate era
grid = [96.0, 72.0]        # block length and width
street_width = 12.0
sidewalk_width = 3.2
parcel_area = 380.0
floors = [[3, 0.2], [4, 0.35], [5, 0.3], [6, 0.15]]
floor_height = 3.6
walls = [["cream", 0.4], ["warm_white", 0.35], ["pale_yellow", 0.25]]
roofs = [["roof_white", 1.0]]
perimeter = true           # buildings line the street, block interiors stay open as courtyards
# massing (prompt 23, city/massing.py): rows, corners, domes and set-back top floors
row_step = [[-1, 0.22], [0, 0.56], [1, 0.22]]   # floors a building differs from its block's row (the median)
corner_step = [[0, 0.4], [1, 0.6]]               # ... a building on a street corner: corners stand taller
row_floors = [3, 7]
corner_angle = 4.0         # degrees off square a street corner may be and still be cut
corner_cut = 0.8           # share of street corners cut: a pan coupe, or rounded
corner_round = 0.25        # share of the cut corners rounded (three faces), when the walls are long enough
chamfer = [3.5, 3.95]      # meters, the pan coupe face: one arcade bay
round_segment = [3.5, 3.8]    # meters, each face of a rounded corner: one window, one arcade bay
corner_rest = 2.5          # meters of straight wall kept beyond a cut
apron_grow = 0.3           # the lot corner a cut leaves open is paved: grown this far to meet the sidewalk
dome_floors = 4            # fewest floors for a corner dome or turret
corner_dome = 0.35         # chance a building with a cut corner carries a dome or a turret over it
corner_top = [["dome", 0.6], ["turret", 0.4]]
dome = { radius = [2.2, 2.8], drum = [0.9, 1.4], rise = 0.85 }     # meters; rise = dome height / radius
turret = { radius = [1.3, 1.6], drum = [3.0, 3.8], rise = 1.15 }
drum_material = [["wall", 0.6], ["minaret_stone", 0.4]]          # "wall": the building's own plaster
dome_cap = [["dome_white", 0.65], ["dome_green", 0.35]]
setback_floors = 4         # fewest floors for a set-back top floor
setback_share = 0.3        # share of those whose top floor stands back from the street walls
setback_depth = 2.0        # meters: the terrace in front of it
setback_min_share = 0.4    # the top floor keeps at least this share of the footprint

[district.modern]          # post-independence housing estates: apartment slabs
grid = [150.0, 110.0]
street_width = 12.0
sidewalk_width = 3.0
parcel_area = 1700.0
setback = 6.0
slab_depth = 13.0
slab_max_length = 55.0
floors = [[4, 0.3], [5, 0.3], [6, 0.2], [8, 0.12], [10, 0.08]]
floor_height = 3.0
walls = [["warm_white", 0.4], ["concrete", 0.25], ["sand", 0.2], ["pastel_blue", 0.15]]
roofs = [["roof_white", 1.0]]
# massing (prompt 23): slabs stepping along their length, at window column joints, and roof machinery
step_share = 0.5           # share of long slabs that step
step_min_length = 30.0     # meters
step_parts = [[2, 0.6], [3, 0.4]]
step_drop = [[1, 0.65], [2, 0.35]]                # floors from one part to the next
step_min_part = 12.0       # meters
step_min_floors = 3
