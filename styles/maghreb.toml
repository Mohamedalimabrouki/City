# People (prompt 28, mesh/people.py): one kit piece person_<key> per entry (instancing cannot recolor).
# Outfits: jebba (robe, trim, under, cap, shoes), shirt (shirt, trousers, shoes, sleeves long or short),
# safsari (wrap), dress (dress, legs, sleeves; `scarf` adds a headscarf), boy (shirt, shorts), girl (dress);
# all take skin, hair (not safsari or a scarf), hem (fraction of the height). Poses: stand, walk, sit (thighs
# level on a seat `seat` m up, the origin under the middle of the seat), carry (walking, `carry` = basket or
