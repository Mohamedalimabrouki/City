railing_white = { color = "#EEECE6", roughness = 0.45 }
lighthouse_white = { color = "#F3F1EB", roughness = 0.85, texture = "render", texture_size = [3.0, 3.0] }
lighthouse_red = { color = "#B3362C", roughness = 0.7 }
dome_green = { color = "#3E7A57", roughness = 0.4 }
plinth_blue = { color = "#70899A", roughness = 0.9, texture = "plaster", texture_size = [2.0, 2.0] }
plinth_stone = { color = "#B3A48B", roughness = 0.92, texture = "stone", texture_size = [2.4, 1.8] }
# Ground (prompt 20): street ribbons and sidewalks have u along the street, so slab rows follow
