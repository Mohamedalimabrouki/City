# meters, so the same plaster serves a medina wall and an apartment block. The palette color
# still gives each material its hue.
lime_white = { color = "#F1EEE6", roughness = 0.92, texture = "plaster", texture_size = [3.0, 3.0] }
warm_white = { color = "#ECE4D3", texture = "plaster", texture_size = [3.0, 3.0] }
cream = { color = "#E8DCC0", texture = "render_cream", texture_size = [3.0, 3.6] }
pale_yellow = { color = "#EAD9A6", texture = "render_cream", texture_size = [3.0, 3.6] }
sand = { color = "#DEC79C", texture = "plaster", texture_size = [3.0, 3.0] }
ochre = { color = "#D2A46A", texture = "plaster", texture_size = [3.0, 3.0] }
pastel_blue = { color = "#C3D5E0", texture = "render", texture_size = [3.0, 3.0] }
concrete = { color = "#C9C3B8", texture = "concrete", texture_size = [2.4, 2.4] }
concrete_dark = { color = "#9A958C", texture = "concrete", texture_size = [2.4, 2.4] }
metal = { color = "#A6ACB1", roughness = 0.5, metallic = 0.3 }
rampart = { color = "#CFAE7C", texture = "stone", texture_size = [2.4, 1.8] }
minaret_stone = { color = "#D9C398", texture = "stone", texture_size = [2.4, 1.8] }
stone_kasbah = { color = "#C4A272", texture = "stone", texture_size = [3.0, 2.2] }   # the kasbah: bigger, warmer ashlar
stone_cathedral = { color = "#DCCBA6", texture = "stone", texture_size = [2.8, 1.9] }   # the cathedral: pale limestone ashlar (prompt 32)
plaster_theatre = { color = "#F3EEE3", texture = "render", texture_size = [3.0, 3.0] }   # the theatre: white Art Nouveau render
stone_dressed = { color = "#C9AF83", texture = "stone", texture_size = [1.8, 1.2] }   # the cathedral's portals, rose, bands and steps: finer, warmer
