curb = { color = "#A29B8E", roughness = 0.85, texture = "stone", texture_size = [3.0, 1.8] }   # 1 m curb stones
urban_ground = { color = "#D6C7A4", texture = "earth", texture_size = [8.0, 8.0] }   # lifted: the texture and tint darken it
