# People in the streets (prompt 29, city/crowd.py): who walks, stands and sits where. `density` scales
# every chance (0 = nobody). Gaps are between kit boxes in plan, meters. Each person has its own stream
# per street station, shop, seat, landmark point or stair door.
[people]
density = 1.0
halo = 4.5                 # a tile checks what its neighbours own this far beyond its edges
clear = 0.5                # between two standing people
pair_gap = 0.15            # side by side in a pair or a family
seated_gap = 0.2           # between a standing person and a seated one
wall_gap = 0.05            # from building walls (seated people may touch the wall behind them)
piece_gap = 0.05           # from goods, stalls, lamps, pillars, trunks, benches, kiosks, cars...
foot_level = 0.06          # pieces lower than this above the floor (mats, paving) do not count
flip = 0.2                 # chance a souk walker walks on the left
jitter = 0.15              # radians a walker turns off the street's direction, at most
bytes_share = 0.085        # people may add this share to a tile's bytes: each figure shown costs its mesh
                           # (about 14 KB), so a light tile shows only its most frequent few (budget +10%)
tile_reach = 1.5           # meters past `clear` beyond a tile's edges from which a person may still crowd one of its own

[people.souk]              # walkers in two lanes down the middle, every `step` m per lane
