end_inset = 15.0           # quays stop this far from the ends of their port district's coast
core_inland = 12.0         # the level ground reaches this far inland of the old coast (the whole corniche)
level_band = 60.0          # then the city ground blends back over this many meters (smootherstep)
shore = 9.5                # the land plus this (the corniche's sea half) is never open sea: sea walls along it
depth = 6.0                # the basin and the water off the quays are dredged to this depth
toe = 16.0                 # full depth this far out from every quay wall
dredge_band = 60.0         # the dredging fades back to the natural seabed over this many meters
wall_step = 8.0            # meters between the wall's outline points
bury = 0.4                 # walls and the rubble's toe reach this far under the seabed
wet = 0.6                  # the wet concrete band: from this height above the sea down
kerb = [0.35, 0.18]        # the quay edge's kerb (wheel guard): width, height
bollard_step = 18.0        # meters between bollards along the quay edge
bollard_inset = 0.75       # bollard center behind the quay edge
fender_step = 18.0         # rubber fenders on the quay wall, half way between the bollards
breakwaters = 1            # harbors closed by a breakwater, longest quays first
out = [0.22, 160.0, 300.0] # how far it reaches out to sea: share of the quay's length, clamped to meters
run = [0.68, 0.8]          # how far it runs back along the quay (share of its length), on the port's stream
bend = [0.0, 0.15]         # its head turns this share of `out` back toward the shore
land_clear = 20.0          # past its root the crest keeps this far off the shore
step = 8.0                 # meters between the breakwater's stations
crest = [3.6, 8.0]         # crest height above the sea, crest width (a concrete road)
slope = 1.5                # rubble slopes: meters across per meter down
rough = 0.55               # jitter of the rubble faces, meters
rows = [0.12, 0.4, 0.72]   # the slope's rows of jittered points, as shares of the way from the crest down to the seabed
parapet = [1.4, 0.9]       # the crown wall on the sea side: height over the crest, thickness
head = 10                  # segments round the half-round head
camera = [10.0, 70.0, 85.0]   # the "port" view: meters back from the harbor mouth along the shore, out to sea, height

[port.armour]              # armour stones in rows along each side of the breakwater, above the water line
z = [2.4, 0.7]             # the rows sit on the slope where it is this high...
lift = 0.45                # ...their centers this far above it (stones resting on the rubble)
step = 2.8                 # meters between stones in a row (the second row sits half a step on)
start = 6.0                # the first this far from the root
size = [3.4, 2.7, 1.9]     # length, width, height of a stone before its scale
scale = [0.75, 1.25]
variants = 3

[port.lighthouse]          # on the breakwater's head, like the harbor lights of La Goulette or Sousse
plinth = [2.7, 1.2]        # base drum: radius, height
tower = [2.1, 1.55, 13.0]  # radius at the foot and at the top, height over the plinth
gallery = [2.45, 0.3]      # the gallery slab: radius, thickness; an iron railing round it
railing = 1.0
lantern = [1.05, 2.1]      # glazed lantern room: radius, height (lantern_glow: it glows at night)
roof = [1.35, 1.1]         # its cap: radius, height
segments = 14
schemes = ["white", "red_top", "bands"]   # white with a red cap, a red top storey, or two red bands
band = 1.8                 # height of a red band

[port.props]                # boats, cranes and cargo (prompt 35, city/moorings.py, mesh/boats.py, mesh/cranes.py)
fishing = [["boat_lateen", 0.4], ["boat_cabin", 0.32], ["boat_rowing", 0.28]]   # the fishing boats' mix
trims = [["hull_blue", 0.7], ["hull_green", 0.15], ["hull_red", 0.15]]   # strake color of each boat piece (its stream)
gap = 1.2                  # a moored boat's end or side keeps this far off the quay edge (fenders are 0.28 m deep)
side_gap = 0.7             # between two boats of a row
row = [4, 9]               # fishing boats in a row moored bow- or stern-to
group_gap = [2.0, 7.0]     # meters of quay between two groups
empty = [0.12, 10.0, 30.0] # odds that a stretch of quay is left empty, and its length
fish_crates = 0.5          # odds of a stack of fish crates on the quay behind a row of boats...
fish_crates_inset = 3.0    # ...this far behind the quay edge (bollards stand 0.75 m behind it)
trawler = 0.22             # odds that the next group along a fishing quay is a trawler moored alongside
open_quay = 0.45           # on a quay no breakwater shelters, odds that a group's place is left empty
end_clear = 8.0            # boats keep this far from a quay's ends and corners
breakwater_clear = 16.0    # boats keep this far off the breakwater's center line (rubble and armour stones)
keel_clear = 0.6           # water under the keel: the seabed lies at least draft + this deep under a boat
commercial = 0.42          # share of the main quay (from the harbor mouth) that is the commercial quay
cranes = [2, 3]            # portal cranes on it, on two rails, one model per harbor
crane_inset = 2.6          # the sea-side rail this far behind the quay edge (bollards stand 0.75 m behind it)
crane_space = 28.0         # meters at least between two cranes
yard_inset = 13.0          # cargo stacks start this far behind the quay edge (behind the land-side rail)
yard_step = [9.0, 7.5]     # cargo slots: meters along the quay, meters across
yard_fill = 0.62           # odds a slot holds cargo
cargo = [["cargo_containers_0", 0.3], ["cargo_containers_1", 0.25], ["cargo_crates", 0.45]]
street_clear = 5.0         # cargo and cranes keep this far off streets, walks and buildings
tree_clear = 4.5           # and this far from trees
anchored = [3, 6]          # boats at anchor in the basin
anchor_clear = 30.0        # they keep this far off every quay edge...
swing = 18.0               # ...and this far apart (room to swing round the anchor)
beach_reach = 320.0        # boats are drawn up on the natural beach within this distance of a quay's end
beach_boats = [4, 9]
beach_step = [3.6, 8.0]    # meters along the coast between two drawn-up boats
beach = [["boat_rowing", 0.6], ["boat_lateen", 0.4]]
beach_clear = 1.2          # drawn-up boats keep this far off streets, walks, buildings and trees
stern_sand = 0.15          # a drawn-up boat's stern rests where the sand stands this high above the sea
beach_sink = 0.05          # and its keel sinks this far into the sand

[port.props.size]          # plan envelope at scale 1: length (along x) and width; every piece fits inside
