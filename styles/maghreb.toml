# --- street dressing (built tile by tile, only for the tiles you export) -------------------
[dressing]
window_spacing = 3.2
window_sill = 0.95         # meters from a floor to the bottom of its windows
window_half = 1.3          # meters each side of a window center that must have wall at its floor (prompt 23:
                           # a set-back top floor, a slab's lower step); the widest window is 2.54 m
door_lantern = 0.35        # chance of a lamp beside a house door
lamp_height = 2.95         # hook height of wall lamps
door_hood = 0.15           # chance of a tiled hood over the door (more for richer households)
hood_height = 3.15
door_pots = [0, 3]
doukkana = 0.25            # stone bench beside traditional doors
cat = 0.07
door_plant = 0.22          # chance of a climber by the door, multiplied by (0.5 + wealth)
door_plants = [["vine", 2], ["cascade", 1.5], ["climber", 0.3]]
vine_height = 3.4
cascade_height = 4.2       # where a bougainvillea cascade hangs from (lower on low houses)
parked = 0.08              # chance of a moped parked by the door
planter = 0.25             # rich houses outside the old town
rich_door = 0.72           # households richer than this get a studded door in a carved frame
bay_wealth = 0.55          # richer traditional households may have birdcage bay windows
bay_window = 0.35
balcony_wealth = 0.6       # richer households may have one closed wooden balcony (mashrabiya)
balcony = 0.4
balcony_height = 0.45
wall_laundry = 0.1         # a clothesline under an upper window
shop_on_souk = 0.85        # share of souk-facing houses with a shop on the ground floor
shop_lamp = 0.3
cafe = 0.3                 # share of colonial ground floors that are cafes with tables outside
roof_tank = 0.32
roof_dish = 0.22
roof_laundry = 0.15
roof_pots = 0.15
laundry = 0.35             # chance, every 9 m along an alley, of a laundry line overhead
cables = 0.12
sabat = 0.05               # chance, every 9 m along an alley, of a sabat (a room bridging the alley)
sabat_clearance = 3.3      # meters of headroom under a sabat
sabat_reach = 5.5          # widest gap a sabat bridges
alley_arch = 0.12          # chance of an arch over each end of an alley
alley_arch_scale = 1.6     # biggest size for an arch (it is sized to reach both walls)
impasse_arch = 0.3         # chance of an arch just inside the mouth of an uncovered impasse (the
                           # houses on both sides must stand taller than it, as for alleys)
souk_gate = 0.5            # chance of a decorated gate at each end of a souk
souk_gate_scale = 1.25
souk_cart = 0.25           # chance, every 20 m along a souk, of a handcart
souk_lanterns = 0.55       # chance, every 12 m along a souk, of a string of lanterns
bunting = 0.2
street_lamps = { boulevard = 26.0, corniche = 24.0, arterial = 32.0, ring = 34.0, street = 30.0 }   # meters between lamps
every_home = true          # every dwelling gets a main door, open walls get windows (false: street walls only, as before 20.1)

# Walls facing open ground (no building within `clear` m in front of them) get windows too, by district.
[dressing.open_walls]
clear = 3.0                # meters of free ground in front of a wall
corner = 0.3               # meters kept free beyond half a window or door at each end of a wall
gap = 0.2                  # meters between a new window or door and any other piece on the wall
door_clear = 2.0           # meters of free ground in front of a new door (goods, cafe chairs and pots stay out)
first = { medina = 1, village = 1, colonial = 1, residential = 0, suburb = 0 }        # lowest floor with windows
share = { medina = 0.45, village = 0.45, colonial = 0.85, residential = 0.7, suburb = 0.85 }   # chance per window

# Modern apartment blocks: a regular grid of windows on every floor, balconies stacked in columns,
# stair doors along the long side facing the nearest street.
[dressing.slab]
bay = 3.2                  # meters per window column on a long side
gable_bay = 0.0            # meters per window column on a short end (0: blind gable ends, as on most blocks)
long = 0.6                 # a wall at least this share of the block's length is a long side
tints = [["white", 3], ["blue", 2], ["green", 2], ["brown", 1.5]]   # shutter color, one per block
balconies = 0.85           # share of blocks with balconies
balcony_period = [2, 3]    # one balcony column in every 2 or 3 columns, on every upper floor
stair_spacing = [20.0, 25.0]   # meters between two stair doors
stair_window = 0.55        # meters from a half landing up to its stair window's sill

# Paved paths from doors that open onto open ground to the nearest sidewalk or street edge.
[dressing.paths]
districts = ["modern", "suburb"]
width = 1.4
lift = 0.04                # above the ground, so it never flickers through the terrain
reach = 40.0               # longest path in meters
step = 4.0                 # meters between draped points (the city ground is smooth)
material = "sidewalk"

# Lit windows at night (prompt 21): the household decides. Each flat (one floor of one side of a
# house; in a modern block, one half of a stair's section) is lit with this chance:
# base + member x (members - members_ref) + wealth x (wealth - 0.5) + trades + district,
# plus couple for two-person households, kept within range. Staircases have their own chance.
[dressing.lit]
base = 0.3
member = 0.025
members_ref = 5
couple = -0.08             # two people, often an older couple: early to bed
wealth = 0.12
trades = { baker = 0.12, student = 0.14, "cafe owner" = 0.12, nurse = 0.08, journalist = 0.1, "taxi driver" = 0.06, farmer = -0.1, shepherd = -0.1, "olive presser" = -0.08, fisherman = -0.08 }
district = { medina = 0.02, colonial = 0.05, modern = 0.06, residential = 0.0, suburb = -0.04, village = -0.1 }
range = [0.05, 0.85]
stair = 0.55               # a staircase's windows and door, lit together
other = 0.1                # a dressed building without a household
pane_offset = 0.008        # meters a kit window's lit pane stands in front of its glass (behind the grille)

# Colonial arcades (prompt 22, city/arcades.py): every colonial facade on one of `kinds` gets a
# ground-floor arcade over its sidewalk, a continuous rhythm of bays from end to end, turning round
# corners (a corner piece; `wrap` bays into a side street). Pillars stand clear of doors, shops and
# cafe tables: the bays flex within `bay` (within `bay_relaxed` only when a wall's length or its doors
# leave no other way). Sizes in meters; the piece is built from them (mesh/props.py arcade_bay).
[dressing.arcade]
districts = ["colonial"]
kinds = ["boulevard", "arterial", "ring"]
bay = [3.5, 4.0]           # bay widths along the wall
bay_relaxed = [3.2, 4.4]
nominal = 3.75             # the piece's own width (placements stretch it along the wall)
depth = 2.5                # wall to the pillars' street face (the sidewalk is 3.2 m)
height = 3.6               # street level to the terrace top: the colonial floor height
pillar = [0.8, 0.45]       # pillar width along the wall, depth
spring = 1.7               # where the arches spring (their crown is half an opening higher)
sink = 0.6                 # pillars reach this far below street level, for sloping sidewalks
cornice = 0.12             # how far the cornice stands out
corner_pier = 0.8
above = 0.5                # the terrace may stand at most this far above the first floor line
step = 0.35                # a run of bays steps down where its sidewalk falls more than this
gap = 0.08                 # free space between a pillar and a door, shop front or cafe table
join = 0.3                 # a run reaches up to this far past its wall end to meet the next building's
bend = 10.0                # degrees: walls meeting at a shallower angle carry one continuous arcade
bend_tol = 2.5             # degrees off 45 (a pan coupe) or 22.5 (a rounded corner) a turn may be and still
                           # get a pier piece (arcade_bend, arcade_bend_round; prompt 23)
corner_angle = 5.0         # degrees off square that a corner piece still takes
wrap = 1                   # bays turned into a side street at a corner
cafe_reach = 1.25          # cafe tables under an arcade stand this far from the wall (1.7 elsewhere)
lamp_shift = 2.25          # street lamps along arcaded walls move this far toward the curb
lamp_clear = 0.3           # and must stand this far outside the pillars, or are left out
tree_trunk = 0.3           # planned street trees by an arcade move out until trunk (this radius) and
tree_clear = 0.05          # this clearance stand beyond the pillars and cornice; left out unless the
tree_curb = 0.3            # trunk then stands this far inside the sidewalk's edge

# Wrought-iron balconies on colonial facades (prompt 22): a floor of a facade has balconies with
# chance row + wealth x (wealth - 0.5); then each of its windows with chance `window`, two neighbours
# sharing one long balcony with chance `long` when their windows are `long_gap` apart. Never on the
# floor right above an arcade (its terrace). A rich household's old mashrabiya spot (`balcony`)
# becomes a window with an iron balcony in the ville nouvelle.
[dressing.balcony_iron]
districts = ["colonial"]
row = 0.4
wealth = 0.6
window = 0.85
long = 0.35
long_gap = [3.0, 3.8]
width = 1.2
depth = 0.6
rail = 1.0                 # rail height above the balcony floor
span = 3.2                 # window spacing the long balcony is built for (stretched to the real one)

# Bougainvillea climbers (citygen/mesh/climbers.py), the `climber` role. The piece hangs on a wall:
# `top` is where the cascade starts, `drop` how far its hem hangs below it.
# materials: deep, mid and pale bracts; leaves: share of green clumps.
[dressing.climber]
variants = 2
top = 4.3
drop = [2.4, 2.8]
spread = [0.85, 1.15]      # half-width of the canopy along the wall
clumps = [38, 40]
clump_radius = [0.28, 0.38]
flatten = 0.72             # clump height / width
depth = 0.42               # clump depth / width (thin against the wall)
depth_jitter = 0.12
jitter = 0.2
leaves = 0.1
rows = 7                   # grid rows from the wall top down to the hem
back = 6                   # dark clumps behind, to fill the gaps between the front ones
materials = ["bougainvillea_deep", "bougainvillea", "bougainvillea_pink"]
leaf_material = "leaf_dark"
trunks = [2, 3]
trunk_radius = 0.055
taper = 0.35
trunk_material = "trunk"
branches = [2, 3]

# Broadleaf and olive crowns (citygen/mesh/trees.py). Sizes are fractions of the tree height.
# clumps: how many leaf clumps; clump_radius: their size; flatten: clump height / width;
# jitter: how lumpy each clump is; materials: dark (low, inside), mid, light (top);
# dark_below / light_above: where the shades switch (0 = lowest clump, 1 = highest).
[dressing.trees.broadleaf]
variants = 3
clumps = [7, 8]
clump_radius = [0.15, 0.2]
crown_radius = 0.27
crown_drop = 0.04         # crown base above the trunk top, as a fraction of height
flatten = 0.85
jitter = 0.18
dark_below = 0.3
light_above = 0.65
materials = ["leaf_dark", "leaf", "leaf_light"]
trunk_height = 0.3
trunk_radius = 0.028
taper = 0.55
trunk_sides = 6
trunk_material = "trunk"
stems = [1, 1]
lean = 0.02
branches = [2, 3]

[dressing.trees.olive]
variants = 3
clumps = [5, 7]
clump_radius = [0.12, 0.17]
crown_radius = 0.5
crown_drop = 0.0
flatten = 0.6
jitter = 0.22
dark_below = 0.3
light_above = 0.6
low_bias = 1.4
materials = ["leaf_olive_dark", "leaf_olive", "leaf_olive_light"]
trunk_height = 0.2
trunk_radius = 0.035
taper = 0.6
trunk_sides = 5
trunk_material = "trunk_olive"
stems = [1, 2]
lean = 0.07
branches = [2, 3]

# Bitter orange (citrus): a short trunk, a low, round, dense crown of dark glossy leaves, and a
# few oranges on it (`fruit` dots of `fruit_size` x height, on their own stream).
[dressing.trees.citrus]
variants = 3
clumps = [7, 8]
clump_radius = [0.19, 0.23]
crown_radius = 0.21
crown_drop = -0.02
flatten = 0.9
jitter = 0.12
dark_below = 0.35
light_above = 0.7
low_bias = 0.8
materials = ["leaf_citrus_dark", "leaf_citrus", "leaf_citrus_light"]
trunk_height = 0.26
trunk_radius = 0.03
taper = 0.6
trunk_sides = 5
trunk_material = "trunk"
stems = [1, 1]
lean = 0.03
branches = [2, 3]
fruit = 14
fruit_size = 0.024
fruit_material = "fruit_orange"

# Low clipped box hedges along villa lot edges (prompt 24): one piece `nominal` m long, stretched
# along the hedge (Placement.stretch, the piece is plain along its length) so each run is filled end
# to end by pieces at most `piece_max` m long (each stands on the ground at its middle); an opening
# where the garden path meets the street (`gate` m wider than the path) and round tree trunks.
[dressing.hedge]
height = 1.0
thick = 0.6
sink = 0.2                 # below the ground, for sloping lots
nominal = 4.0
piece_max = 8.0
gate = 0.6
trunk_clear = 0.5
garden_lift = 0.02         # the garden ground stands this far above the terrain mesh (paths: 0.04)

