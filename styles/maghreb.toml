# --- the corniche's seafront (prompt 36, city/corniche.py, mesh/corniche.py) ----------------
# Like the corniches of La Marsa, Sousse or Bizerte: on the sea side of the corniche a raised, paved promenade
# (its curb where the land side's sidewalk would end), the beach-side palm row in tree pits by the curb, lamps
# between the palms, benches along the railing facing the sea, a low stone sea wall with a whitewashed coping
# band and a white iron railing on its edge, steps down to the sand. Only along the districts below; the
# harbor, industrial and cemetery stretches keep the plain corniche.
[corniche]
districts = ["colonial", "modern", "residential"]
curb = 3.2                 # the promenade's curb stands this far inside the corniche's sea edge
width = 8.0                # the promenade's width where at least `beach_min` m of sand remain beyond it ...
max_width = 10.0           # ... else as wide as fits up to this (the wall then stands at the water) ...
min_width = 6.0            # ... and no promenade at all where less than this fits
beach_min = 3.0            # meters of sand between the sea wall and the water line that make a beach
water = 0.05               # the water line: where the natural ground is this high above the sea
step = 8.0                 # meters between the stations the promenade's outline is built on
piece = 32.0               # meters along the corniche per walk piece (a tile draws the pieces it holds)
clear = 1.5                # meters kept from the harbor's ground and the drawn-up boats
cross_area = 2.0           # m2: a street surface covering more of a station's band breaks the promenade there
palm_inset = 1.5           # the palm row (and its lamps) this far from the curb
lamp_every = 2             # a lamp in every second gap between two palms
bench = 0.8                # chance of a bench (role `seafront_bench`) in a gap between two palms ...
bench_back = 1.35          # ... its middle this far in from the sea edge, facing the sea
bench_gap = 6.0            # palms at least this far apart
railing_piece = 2.0        # meters: railing lengths are stretched to fit the edge between bends
railing_inset = 0.06       # railing's center line inside the sea edge
coping = 0.22              # whitewashed band at the top of the sea wall's face
foot = 0.35                # the wall reaches this far under the sand or the seabed
stair_every = 72.0         # meters between flights of steps down to the beach ...
stair_sand = 2.4           # ... where at least this much sand lies beyond the wall
stair = [2.4, 0.18, 0.32]  # a flight's width, highest riser, tread

# Seaside cafe terraces (prompt 37, city/terraces.py): like the seafront cafes of La Marsa, Sidi Bou Said or Sousse.
# A main wall on the promenade's stretch may be a cafe; its terrace stands on its sidewalk and, by chance, across the
# road on the palm line; drinks kiosks by the railing have tables beside them. Tables are `cafe_set` (chairs along
# the row), shaded by parasols of one color per group (role `parasol`).
[corniche.terrace]
cafe = 0.5                 # chance a main wall on the stretch is a cafe (besides the colonial cafe chance)
end = 4.0                  # its middle at least this far inside the stretch's ends
tables = [2, 4]            # tables on a cafe's sidewalk ...
reach = 1.7                # ... their centers this far from the wall
wall_margin = 0.5          # ... the chairs this far inside the wall's ends
pitch = 2.6                # meters between two tables of a row (two canopies just clear)
across = 0.6               # chance a cafe also has tables across the road, in the nearest palm gap without a lamp ...
across_tables = [2, 3]
across_reach = 16.0        # ... that gap's middle at most this far along from the cafe's middle
row_reach = 2.3            # the palm line's tables stay within this far from the curb: the walkway beyond is free
kiosk = 0.4                # chance of a drinks kiosk by the railing in a palm gap ...
kiosk_gap = 10.0           # ... at least this long, clear of the steps
kiosk_spacing = 60.0       # meters between two kiosk cafes, at least
kiosk_back = 0.3           # the kiosk's back this far from the sea edge
kiosk_tables = [2, 4]      # tables along the railing beside it
kiosk_lit = 0.6            # chance a kiosk is open and lit at night
sea_reach = 2.8            # a kiosk cafe stays within this far from the sea edge
min_width = 7.5            # promenade groups only where the promenade is this wide (the walkway keeps 3 m and more)
rail_clear = 0.2           # canopies stay this far inside the sea edge
stair_clear = 1.2          # nothing this close to the side of a flight of steps
parasol_clear = 0.15       # a canopy from any piece (lamps, trunks, crowns, awnings, other canopies)
piece_clear = 0.15         # a table set from any piece
jitter = 0.12              # radians a table turns off its row, at most
town_tile = 1              # terraces only in tiles holding this many buildings: a tile with only the sea half of the
                           # promenade and the beach is light (about 300 KB), and one kiosk cafe would add a fifth

[district.park]
tree_spacing = 13.0

[district.cemetery]
tree_spacing = 24.0
marabouts = 3              # small domed shrines

# --- more greenery (prompt 24, city/greenery.py): trees added after all others ----------
# Street trees along arterials: a row of tree pits behind the curb of colonial and modern
# sidewalks, as on the avenues of Tunis (mostly ficus, some streets of palms). One species per street.
[greenery.arterial]
kinds = ["arterial"]
districts = ["colonial", "modern"]
spacing = 8.5              # meters between two trees along the street
pit = 0.9                  # meters from the curb face to the trunk
trunk_clear = 0.5          # the trunk stays this far inside its sidewalk
junction_clear = 5.0       # meters from any other street (so clear of the zebra crossings too)
paint_clear = 1.1          # meters from any road marking (edge lines stay 1.3 m away)
wall_clear = 2.0           # meters from any building
lamp_clear = 3.0           # meters along the street from a lamp on the same side
door_clear = 1.6           # meters from a stair door's paved path (carried on over the sidewalk)
species = [["broadleaf", 0.75], ["palm", 0.25]]
height = { broadleaf = [6.0, 8.0], palm = [8.0, 11.0] }

# Courtyards without a tree may get one: mostly bitter oranges in the medina, olives and figs in villages.
[greenery.courtyard]
chance = { medina = 0.4, village = 0.35 }
kinds = { medina = [["citrus", 0.75], ["broadleaf", 0.15], ["olive", 0.1]], village = [["citrus", 0.4], ["olive", 0.4], ["broadleaf", 0.2]] }
height = { citrus = [3.2, 4.6], broadleaf = [4.0, 6.0], olive = [3.5, 5.0] }
min_area = 12.0            # square meters of courtyard
wall_clear = 0.3           # meters between the crown and the courtyard walls
min_height = 2.4           # no tree when the courtyard only has room for a smaller one

# Villa gardens: a few fruit trees behind or beside the house (garden_trees of [district.suburb] stay).
[greenery.garden]
count = [0, 2]
kinds = [["citrus", 0.7], ["olive", 0.3]]
height = { citrus = [3.0, 4.2], olive = [3.5, 5.0] }
behind = 1.5               # meters farther from the nearest street than the house (clear of the gate path)
edge_clear = 1.5           # meters from the lot edges (the hedges)
tree_clear = 3.0           # meters from any other tree

# --- roofs -------------------------------------------------------------------------
# Flat roofs get a low wall around the edge (a parapet) and some of them a stair room,
# a small room with a door that opens on the roof. Heights and shares by district kind.
[roofs]
parapet_thickness = 0.2
parapet_fallback = 0.7     # for a district kind not listed below
parapet_height = { medina = 0.85, village = 0.7, colonial = 0.9, modern = 0.8, residential = 0.7, suburb = 0.75, industrial = 0.6, port = 0.6 }
stair_room = { medina = 0.35, village = 0.35, colonial = 0.6, modern = 0.6, residential = 0.35, suburb = 0.3 }   # share of flat roofs with a stair room
stair_side = 2.5           # meters, square footprint
stair_height = 2.4         # meters above the roof deck
stair_gap = 0.25           # meters between the stair room and the parapet
stair_door_width = 0.9
stair_door_height = 1.95
stair_door_reach = 0.8     # meters of free roof a side needs before it takes the door
menzah_size = [3.0, 2.4]   # meters: a menzah, the old-town roof room (prompt 23)
menzah_height = 2.3
menzah_gap = 0.6           # meters of roof kept between it and the stair room or anything else
menzah_windows = 2

# --- plinths ------------------------------------------------------------------------
# The base band of a building wall (prompt 19): everything within `height` meters of the
# highest ground point under the building is drawn in another material, so a street sees a
# clean base instead of the buried foot of the wall. Kinds not listed keep the plain wall;
# ramparts, towers and minarets never get a base.
[plinth]
medina = { material = "plinth_blue", height = 0.8 }
village = { material = "plinth_stone", height = 0.7 }
colonial = { material = "plinth_stone", height = 0.9 }
modern = { material = "concrete_dark", height = 0.6 }
residential = { material = "plinth_stone", height = 0.7 }
suburb = { material = "plinth_stone", height = 0.6 }

