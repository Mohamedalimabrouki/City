# --- more greenery (prompt 24, city/greenery.py): trees added after all others ----------
# Street trees along arterials: a row of tree pits behind the curb of colonial and modern
# sidewalks, as on the avenues of Tunis (mostly ficus, some streets of palms). One species per street.
