# citygen default settings.
#
# Do not edit this file to make your own world: create a small file in
# worlds/ (see worlds/example.toml) with only the lines you want to change,
# then run:  python -m citygen build --world worlds/your_world.toml

[world]
seed = 42              # the starting number. Same seed = same world. Change it for a new world.
size_km = 64           # the country is a square this many kilometers wide
style = "maghreb"      # style pack to use, from the styles/ folder
name = ""              # country name; leave empty to let the generator invent one

[terrain]
sea_direction = "random"  # where the sea is: "random", or a compass bearing in degrees (0 = north, 90 = east)
coast_position = 0.22     # bigger = more land, smaller = more sea
inland_rise = 900.0       # meters the land climbs from the coast to the far interior
hill_height = 90.0        # size of rolling hills, meters
mountain_height = 1150.0  # size of the mountain range, meters
mountain_band = 0.36      # how far inland the mountains are (0 = on the coast, 0.7 = deep inland)
islands = true            # allow small islands off the coast

[settlements]
# How many settlements per 1000 square kilometers of country.
cities_per_1000_km2 = 1.6
towns_per_1000_km2 = 6.0
villages_per_1000_km2 = 24.0
# Minimum distance (meters) between settlements of the same or bigger kind.
city_spacing = 11000.0
town_spacing = 4500.0
village_spacing = 1700.0
population_scale = 1.0    # multiply every population (and so every city size)

[roads]
routing_cell = 200.0      # meters; grid used to find road routes over the terrain
max_regional_km = 26.0    # longest road built between two towns

[tiles]
size = 512                # tile width in meters
terrain_step = 8.0        # meters between terrain mesh points
dressing = true           # doors, windows, shops, goods and street life (see [dressing] in the style)
textures = "shared"       # base-color textures named by [palette]: "shared" writes each image once to
                          # tiles/textures/ and tiles link it; "embedded" puts the bytes inside every .glb
                          # (single-file exports such as hero scenes); "off" keeps flat colors
quantize = true           # KHR_mesh_quantization: 16-bit positions (about 8 mm steps over a tile), 8-bit
                          # normals, 16-bit instance rotations, welded vertices; false writes plain floats
fine_edge = 0.05          # meters: triangles with a shorter edge (ropes, cables, rods) keep float positions
float_materials = ["water"]   # kept float: the viewer finds the sea from the water's own height
flat_angle = 1.0          # degrees: flat faces whose written corners give back their normal within this
                          # angle are written without NORMAL (readers compute flat normals)

[tiles.lod]
# Level of detail (prompt 40, citygen/mesh/lod.py): next to every tile a light tile_<i>_<j>_lod1.glb for
# distant views: merged blocks, landmarks as low-poly shapes, coarse terrain, flat colors.
enabled = true
terrain_step = 32.0       # meters between terrain points (rounded to an even multiple of terrain_step above that
                          # divides the tile); the tile edges keep the full tile's points, so full and lod1
                          # tiles meet exactly
skirt = 4.0               # meters a strip hangs below each tile edge (hides cracks between two tiles)
street_lift = 0.5         # meters streets float over the lod terrain (depth precision far away)
street_step = 16.0        # meters between ribbon points along a street
street_simplify = 1.0     # meters: a street's center line is simplified this much first
skip_streets = ["impasse"]   # street kinds left out (impasses run inside blocks, filled by `close`)
close = 1.5               # meters: gaps narrower than twice this between a block's buildings are closed
simplify = 1.0            # meters: tolerance of the merged block outline
min_hole = 100.0          # square meters: smaller courtyards are filled
min_part = 12.0           # square meters: smaller pieces of a block are left out
sink = 2.0                # meters walls reach below the ground
parapet = 0.5             # meters a flat house or apartment roof gains (its parapet in the full tile)
hip = 1.2                 # meters a hip roof's eave gains in a block (about a third of the roof's rise)
tall = 20.0               # meters: buildings at least this tall stand alone, out of their block...
tall_ratio = 1.6          # ...and so do those this many times their block's mean height
dome_segments = 8         # sides of a lod dome, drum, lantern cap
cluster = 1.2             # meters: grid cell that simplifies the cathedral, theatre and station meshes
cluster_port = 3.0        # meters: the same for quay walls, breakwater and lighthouse
crease = 45.0             # degrees: clustered faces meeting at a gentler angle shade smooth and share vertices
cluster_drop = ["glass_dark", "glass_lit", "iron", "wood", "lantern_glow", "rope", "stud_black", "dial_white",
                "road_paint"]   # details left out of clustered meshes (windows, doors, ironwork)

[ground]
# Inside a city the ground is graded: smoothed and gently flattened under blocks, then
# blended back into the natural terrain at the city limit (see citygen/city/ground.py).
radius = 60.0             # meters: disc over which the terrain is averaged inside a city
lattice = 8.0             # meters: world-aligned grid the smoothing is computed on
terrace_max = 0.4         # meters: how far a block may be flattened away from that average
edge = 18.0               # meters: terrace fade at a block edge (at least 2 x terrain_step)
terrace_max_area = 6000.0 # square meters: bigger blocks are not terraced
edge_band = 40.0          # meters over which the city ground blends into natural terrain

[build]
# Which part of the world to export as 3D tiles:
#   "capital-center"   tiles within center_radius of the capital (fast, default)
#   "capital"          the whole capital
#   "city:NAME"        a whole settlement, "city-center:NAME" its center only
#   "box:X0,Y0,X1,Y1"  a rectangle in kilometers
#   "all"              the whole country (slow, many files)
#   "none"             no 3D tiles, only data and maps
area = "capital-center"
center_radius = 1200.0
output = "output"
workers = 0               # processes that build 3D tiles: 0 = all cores but one, 1 = one process
kits = ["tounes"]         # extra 3D piece kits from the kits/ folder (pieces made in Tounes Rush)
