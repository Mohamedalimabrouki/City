# An example world. Copy this file, change what you like, then run:
#   python -m citygen build --world worlds/example.toml
# Anything not listed here keeps its default value (see citygen/defaults.toml).

[world]
seed = 2026          # any whole number; each one is a different country
size_km = 48         # 48 x 48 km
name = ""            # e.g. "Zaria"; leave empty to let the generator invent a name
name_ar = ""         # e.g. "زارية": the Arabic spelling of a pinned name (else the country has none)

[terrain]
sea_direction = 0    # the sea is to the north (compass bearing, or "random")

[build]
area = "capital-center"

# Story canon: once you have written about a place, pin its name here so it never changes.
# The key is the name the generator gave the place, shown by:  python -m citygen list --world worlds/example.toml
# (the name stays with the place when the generator changes; a key that names no place gives a warning).
[canon.names]
# "Tagabret" = "Carthage Nova"
# "Soura el Bey" = "Sidi Amor"
# A pinned name has no Arabic spelling unless you pin that too:
[canon.names_ar]
# "Tagabret" = "قرطاج الجديدة"
# "Soura el Bey" = "سيدي عمر"
